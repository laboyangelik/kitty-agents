name: Release

# Trigger by pushing a version tag: git tag v1.3.0 && git push origin v1.3.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.3.0)'
        required: true

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT so the appcast commit can trigger future workflows if needed
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          BUILD=$(git rev-list --count HEAD)
          ZIP="kitty-agents-${VERSION}.zip"
          echo "version=$VERSION"  >> $GITHUB_OUTPUT
          echo "build=$BUILD"      >> $GITHUB_OUTPUT
          echo "zip=$ZIP"          >> $GITHUB_OUTPUT
          echo "tag=v$VERSION"     >> $GITHUB_OUTPUT

      - name: Build (archive)
        run: |
          xcodebuild archive \
            -project lil-agents.xcodeproj \
            -scheme LilAgents \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/LilAgents.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            2>&1 | grep -E "error:|warning:|archive"

      - name: Package .app → .zip
        run: |
          APP=$(find "$RUNNER_TEMP/LilAgents.xcarchive" -name "*.app" | head -1)
          echo "Found app: $APP"
          mkdir -p "$RUNNER_TEMP/dist"
          cp -R "$APP" "$RUNNER_TEMP/dist/"
          # Ad-hoc sign so macOS doesn't flag it as completely unsigned
          codesign --force --deep --sign - "$RUNNER_TEMP/dist/kitty agents.app"
          cd "$RUNNER_TEMP/dist"
          zip -r "$RUNNER_TEMP/${{ steps.ver.outputs.zip }}" "kitty agents.app"
          echo "Zip size: $(du -h "$RUNNER_TEMP/${{ steps.ver.outputs.zip }}" | cut -f1)"

      - name: Download Sparkle tools
        run: |
          curl -L -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.7.5/Sparkle-2.7.5.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

      - name: Sign update with Sparkle EdDSA
        id: sign
        run: |
          # Write private key from secret to a temp file
          printf '%s' "${{ secrets.SPARKLE_PRIVATE_KEY }}" > "$RUNNER_TEMP/sparkle_key.txt"

          OUTPUT=$("$RUNNER_TEMP/sparkle/bin/sign_update" \
            --ed-key-file "$RUNNER_TEMP/sparkle_key.txt" \
            "$RUNNER_TEMP/${{ steps.ver.outputs.zip }}" 2>&1)
          echo "sign_update output: $OUTPUT"

          SIG=$(echo "$OUTPUT" | grep -o 'edSignature="[^"]*"' | sed 's/edSignature="\([^"]*\)"/\1/')
          LEN=$(stat -f%z "$RUNNER_TEMP/${{ steps.ver.outputs.zip }}")

          echo "signature=$SIG" >> $GITHUB_OUTPUT
          echo "length=$LEN"    >> $GITHUB_OUTPUT

          # Clean up private key immediately
          rm -f "$RUNNER_TEMP/sparkle_key.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: ${{ runner.temp }}/${{ steps.ver.outputs.zip }}

      - name: Update appcast.xml
        run: |
          python3 << 'PYEOF'
import re
from datetime import datetime, timezone

version   = "${{ steps.ver.outputs.version }}"
build     = "${{ steps.ver.outputs.build }}"
sig       = "${{ steps.sign.outputs.signature }}"
length    = "${{ steps.sign.outputs.length }}"
repo      = "${{ github.repository }}"
zip_name  = "${{ steps.ver.outputs.zip }}"
url       = f"https://github.com/{repo}/releases/download/v{version}/{zip_name}"
date      = datetime.now(timezone.utc).strftime("%a, %d %b %Y %H:%M:%S +0000")

new_item = f"""\
        <item>
            <title>v{version}</title>
            <description><![CDATA[<p>kitty agents {version}</p>]]></description>
            <pubDate>{date}</pubDate>
            <sparkle:version>{build}</sparkle:version>
            <sparkle:shortVersionString>{version}</sparkle:shortVersionString>
            <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
            <enclosure
                url="{url}"
                type="application/octet-stream"
                sparkle:edSignature="{sig}"
                length="{length}"
            />
        </item>"""

with open("appcast.xml") as f:
    content = f.read()

# Insert newest release before the first existing <item>
content = content.replace("<item>", new_item + "\n        <item>", 1)

with open("appcast.xml", "w") as f:
    f.write(content)

print(f"appcast.xml updated for v{version}")
PYEOF

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "release ${{ steps.ver.outputs.tag }}"
          git push origin HEAD:main
