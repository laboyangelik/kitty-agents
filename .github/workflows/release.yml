name: Release

# Trigger by pushing a version tag:
#   git tag v1.3.0 && git push origin v1.3.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.3.0)'
        required: true

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          BUILD=$(git rev-list --count HEAD)
          ZIP="kitty-agents-${VERSION}.zip"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD"     >> $GITHUB_OUTPUT
          echo "zip=$ZIP"         >> $GITHUB_OUTPUT
          echo "tag=v$VERSION"    >> $GITHUB_OUTPUT

      - name: Build (archive)
        run: |
          xcodebuild archive \
            -project lil-agents.xcodeproj \
            -scheme LilAgents \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/LilAgents.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            2>&1 | grep -E "error:|archive|ARCHIVE"

      - name: Package .app → .zip
        run: |
          APP=$(find "$RUNNER_TEMP/LilAgents.xcarchive" -name "*.app" | head -1)
          echo "Packaging: $APP"
          mkdir -p "$RUNNER_TEMP/dist"
          cp -R "$APP" "$RUNNER_TEMP/dist/"
          codesign --force --deep --sign - "$RUNNER_TEMP/dist/kitty agents.app"

          cd "$RUNNER_TEMP/dist"
          ditto -c -k --sequesterRsrc --keepParent "kitty agents.app" "$RUNNER_TEMP/${{ steps.ver.outputs.zip }}"
          cp "$RUNNER_TEMP/${{ steps.ver.outputs.zip }}" "$RUNNER_TEMP/kitty-agents-latest.zip"
          echo "Size: $(du -sh "$RUNNER_TEMP/${{ steps.ver.outputs.zip }}" | cut -f1)"

      - name: Download Sparkle tools
        run: |
          curl -L -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.1/Sparkle-2.9.1.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

      - name: Sign with Sparkle EdDSA
        id: sign
        run: |
          printf '%s' "${{ secrets.SPARKLE_PRIVATE_KEY }}" > "$RUNNER_TEMP/sparkle_key.txt"

          OUTPUT=$("$RUNNER_TEMP/sparkle/bin/sign_update" \
            --ed-key-file "$RUNNER_TEMP/sparkle_key.txt" \
            "$RUNNER_TEMP/${{ steps.ver.outputs.zip }}" 2>&1)

          SIG=$(echo "$OUTPUT" | grep -o 'edSignature="[^"]*"' | sed 's/edSignature="\([^"]*\)"/\1/')
          LEN=$(stat -f%z "$RUNNER_TEMP/${{ steps.ver.outputs.zip }}")

          echo "signature=$SIG" >> $GITHUB_OUTPUT
          echo "length=$LEN"    >> $GITHUB_OUTPUT
          rm -f "$RUNNER_TEMP/sparkle_key.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/${{ steps.ver.outputs.zip }}
            ${{ runner.temp }}/kitty-agents-latest.zip

      - name: Update appcast.xml
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_BUILD:   ${{ steps.ver.outputs.build }}
          RELEASE_ZIP:     ${{ steps.ver.outputs.zip }}
          SPARKLE_SIG:     ${{ steps.sign.outputs.signature }}
          RELEASE_LENGTH:  ${{ steps.sign.outputs.length }}
        run: python3 .github/scripts/update_appcast.py

      - name: Commit updated appcast.xml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "release ${{ steps.ver.outputs.tag }}"
          git push origin HEAD:main
